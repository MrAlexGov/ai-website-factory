name = "raha-cooling-form"
main = "src/index.js"
compatibility_date = "2026-11-07"

# Create a KV namespace and replace the id below before deploying.
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "REPLACE_WITH_CLOUDFLARE_KV_NAMESPACE_ID"

[vars]
ALLOWED_ORIGIN = "https://mralexgov.github.io"

# Set secrets with Wrangler, never commit them:
# npx wrangler secret put TURNSTILE_SECRET_KEY
# npx wrangler secret put APPS_SCRIPT_URL
# npx wrangler secret put APPS_SCRIPT_SHARED_SECRET
