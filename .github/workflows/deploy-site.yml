name: Build and deploy Abu Dhabi demo site

on:
  push:
    branches: [main]
    paths:
      - "projects/abu-dhabi-ac/site/**"
      - "projects/abu-dhabi-ac/site.config.toml"
      - "tools/site_factory/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run builder tests
        run: python -m unittest discover -s tools/site_factory/tests -v

      - name: Build and validate site
        run: python tools/site_factory/build.py --project projects/abu-dhabi-ac

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/abu-dhabi-ac

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
